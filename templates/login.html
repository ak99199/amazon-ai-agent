<!doctype html><html><head><title>Dashboard Login</title><link rel="stylesheet" href="/static/styles.css"></head><body><main><section class="panel login"><h1>Seller Dashboard</h1><p>Sign in to view seller insights.</p>{% if error %}<p class="empty">{{error}}</p>{% endif %}<form method="post" action="/login"><input type="hidden" name="csrf" value="{{csrf_token}}"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button type="submit">Sign in</button></form></section></main></body></html>
